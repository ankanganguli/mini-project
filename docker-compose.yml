version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: factcheck_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - factcheck_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: factcheck_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=factcheck_db
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    depends_on:
      - mongodb
    networks:
      - factcheck_network

  frontend:
    image: nginx:alpine
    container_name: factcheck_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - factcheck_network

volumes:
  mongo_data:
    driver: local

networks:
  factcheck_network:
    driver: bridge
